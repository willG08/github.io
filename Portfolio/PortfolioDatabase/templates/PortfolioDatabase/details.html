{% extends "PortfolioDatabase/base.html" %}
{% block body %}
<div class="d-flex align-items-center">
    <h1 class="homeTitle">{{hobby.hobby_name}} Details -</h1>
    <h3 class="nameTitle"><strong>Will Gunther</strong></h3>
</div>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <img id="detailsImg" width="300px" class="card" src="{{hobby.hobby_image}}" alt="Image of {{hobby.hobby_name}}">
            </div>
            <div class="col-md-6">
                <h1 id="hTitle txt-darkblue">{{hobby.hobby_name}}</h1>
                <p class="pDate">Years of Experience: {{hobby.hobby_years}}</p>
                <article class="bg-light p-3 border-dkblue">{{hobby.hobby_description}}</article>
                <a href="{% url 'PortfolioDatabase:Hobbies'%}" class="btn btn-dkblue-success detailsBtn">Back to Hobbies</a>
            <a href="{% url 'PortfolioDatabase:Home' %}" class="btn btn-dkblue-success detailsBtn">Back to Home</a>
            </div>
            
    </div>
    
{% endblock %}
