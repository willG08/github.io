{% extends "PortfolioDatabase/base.html" %} 
{% block body %}
<div class="d-flex align-items-center">
    <h1 class="homeTitle">Hobbies -</h1>
    <h3 class="nameTitle"><strong>Will Gunther</strong></h3>
</div>
            {% for hobby in hobbies_list %}
            <div class="row">
                <div class="col-md-3 offset-md-3">
                    <img class="card" width="200px" src="{{hobby.hobby_image}}" alt="Image of {{hobby.hobby_name}}">
                </div>
                <div class="col-md-4 bg-light p-3 border-dkblue">
                    <h3 class="mt-3 mb-0 txt-darkblue">{{hobby.hobby_name}}</h3>
                    <p class="mb-2">Years of Experience:{{hobby.hobby_date_published}}</p>
                    <h6>{{hobby.hobby_description}}</h6>
                </div>
                <div class="col-md-2">
                    <a class="btn btn-dkblue-success" href="{% url 'PortfolioDatabase:Details' hobby.id%}">Details</a>
                </div>
            </div>
            {% endfor %}
{% endblock %}
