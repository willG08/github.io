{% extends "PortfolioDatabase/base.html" %}
{% block body %}
<div class="d-flex align-items-center">
    <h1 class="homeTitle">{{portfolio.portfolio_name}} Details -</h1>
    <h3 class="nameTitle"><strong>Will Gunther</strong></h3>
</div>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h1 id="hTitle">{{portfolio.portfolio_name}}</h1>
                <p class="pDate">Date Created: {{portfolio.portfolio_created}}</p>
                <article class="bg-light p-3 border-dkblue">{{portfolio.portfolio_description}}</article>
                <a href="{% url 'PortfolioDatabase:Portfolio'%}" class="btn btn-dkblue-success detailsBtn">Back to Portfolio</a>
            <a href="{% url 'PortfolioDatabase:Home' %}" class="btn btn-dkblue-success detailsBtn">Back to Home</a>
            </div>
            <div class="col-md-6">
                <img id="detailsImg" max-width="500px" class="card"  src="{{portfolio.portfolio_image}}" alt="Image of {{portfolio.portfolio_name}}">
                
            </div>
            
            
    </div>
    
{% endblock %}
